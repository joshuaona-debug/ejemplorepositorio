<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /*MOBILE FIRST*/
        /*SIN NINGUN MEDIA QUERY (Para telefonos)*/
        div{
            background: red;
            height: 100px;
        }
        /*TABLETS*/
        @media screen and (min-width: 768px){
            div{
                background: green;
                height: 200px;
            }
        }
        /*Para PC*/
        @media screen and (min-width: 1200px){
            div{
                background: blue;
                height: 100dvh;
            }
        }
        /*FORMATOS GRANDES*/
        @media screen and (min-width: 2400px){
            div{
                background: purple;
                height: 100dvh;
            }
            
        }
    </style> 
</head>
<body>
<div></div>
</body>
</html>
